<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi - Logs</title>
  <meta name="description" content="OpenFi Logs Page">
  <link rel="stylesheet" type="text/css" href="../styles/main-default.css">
  <link rel="stylesheet" type="text/css" href="../styles/pages/logs.css">
</head>

<body>
  <div class="layout">
    <section class="main">
      <div class="header">
        <h2>Logs</h2>
      </div>

      <table>
        <thead>
          <tr>
            <th>Event</th>
            <th>Device</th>
            <th>Time</th>
            <th>Risk</th>
            <th>Information</th>
          </tr>
        </thead>
        <tbody id="devices-tbody">
          <!-- ./logs.js -->
        </tbody>
      </table>
    </section>

    <section style="display: none;" id="context-menu" class="context-menu">
      <h1>Logs Information</h1>

      <table id="context-data">
        <!-- tbody from ./logs.js -->
      </table>
      <button class="btn restart" id="deleteBtn"> Delete Event </button>
    </section>
  </div>

<script src="../data/db.js"></script>
<script src="../scripts/actions.js"></script>
<script src="../scripts/pages/logs.js"></script>
<script>
  loadTable()
</script>

</body>
</html>
