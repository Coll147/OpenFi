<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi - Devices</title>
  <meta name="description" content="OpenFi Devices Page">
  <link rel="stylesheet" type="text/css" href="../styles/main-default.css">

<body>

  <section class="main">
    <div class="header">
      <h2>Devices</h2>
      <button class="add-btn">Add Device</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>DEVICE</th>
          <th>IP ADDRESS</th>
          <th>STATUS</th>
          <th>UPTIME</th>
          <th>MODEL</th>
          <th>VERSION</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="devices-tbody">
        <!-- ./devices.js -->
      </tbody>
    </table>
  </section>

  <section style="display: none;" id="context-menu" class="context-menu">

    <!-- <img src="https://i01.appmifile.com/webfile/globalimg/products/m/xiaomi-router-ax3200/mSpecs_img.png"> -->
    <h1>Device Name</h1>
    
    <h3>Device WIFI</h3>
    <table id="wifi-status">
      <!-- tbody from ./devices.js -->
    </table>

    <h3>Device Status</h3>
    <table id="device-status">
      <tbody>
        <tr>
          <td>Name</td>
          <td>ap salon</td>
        </tr>
        <tr>

          <td>Xiaomi Redmi Router AX6S</td>
        </tr>
        <tr>

          <td>192.168.5.2</td>
        </tr>
        <tr>

          <td>OpenWrt 24.10.3</td>
        </tr>
        <tr>
          <td>RAM / CPU Usage</td>
          <td>47% / 2.5%</td>
        </tr>
      </tbody>
    </table>
    

  </section>

<script src="../scripts/actions.js"></script>

</html>
