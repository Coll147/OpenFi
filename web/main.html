<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Network</title>
  <meta name="description" content="OpenFi Network">

  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  
  <link rel="stylesheet" type="text/css" href="./styles/main-default.css">
  <!-- <link rel="stylesheet" type="text/css" href="./styles/main-mobile.css"> -->
</head>

<body>
  <div class="layout">
    <nav class="sidebar">
      <img class="logo" src="./assets/logo.png" alt="OpenFi Logo" draggable="false">

      <ul class="menu">
        <li data-page="dashboard" class="active">📊 Dashboard</li>
        <li data-page="topology">🧭 Topology</li>
        <li data-page="devices">📶 Devices</li>
        <li data-page="logs">📜 Logs</li>
        <li data-page="wifi">📡 Wi-Fi</li>
        <li data-page="network">🌐 Network</li>
        <li data-page="settings">⚙️ Settings</li>
        <li data-page="information">📞 Information</li>
      </ul>


      <footer>
        <a href="https://github.com/Coll147/OpenFi">OpenFi project | FOOS | 2025</a>
      </footer>
    </nav>

    <main class="main">
      <iframe id="content-frame" src="./assets/favicon.ico"></iframe>
    </main>
  </div>

  <script>
// Actualizar contenido
function updatePage(page, element, push = true) {
  // Actualizar iframe
  const frame = document.getElementById('content-frame')
  const src = "./dashboard/" + page + ".html"
  frame.contentWindow.location.replace(src)

  // Actualizar NAV
  document.querySelectorAll('.menu li').forEach(l => l.classList.remove('active'))
  if (element) element.classList.add('active')

  // Actualizar URL
  if (push) { // solo cuando se navegue (no direct load)
    history.pushState({ page }, "", `?page=${page}`)
  }
}


// Listener de click en los elementos del nav
document.querySelectorAll('.menu li').forEach(link => {
  link.addEventListener('click', function(e) { // listener en el click
    e.preventDefault()

    const page = this.dataset.page
    console.log(this)
    console.log(page)
    updatePage(page, this, true)
  })
})


// Soporte para botón atrás/adelante del navegador
window.addEventListener("popstate", e => {
  const page = e.state?.page || "dashboard"
  const li = document.querySelector(`.menu li[data-page="${page}"]`)

  updatePage(page, li, false)
})


// Cargar página inicial si llega desde URL completa (con el ?)
  window.addEventListener("DOMContentLoaded", () => { // cuando cargue el dom
    
  const url = new URLSearchParams(window.location.search)
  const page = url.get("page") || "dashboard"
  
  const li = document.querySelector(`.menu li[data-page="${page}"]`)
  updatePage(page, li, false)
  console.log(page, li, false)
})

  </script>
</body>
</html>
