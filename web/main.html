<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Dashboard</title>
  <link rel="stylesheet" href="styles/base.css">
</head>

<body>
    <div class="sidebar">
        <h1 class="logo"><img src="assets/logo.png" draggable="false"></h1>
        <ul class="menu">
        <li>📊 Dashboard</li>
        <li>🧭 Topology</li>
        <li class="active">📶 Devices</li>
        <li>📜 Logs</li>
        <li>📡 Wi-Fi</li>
        <li>🌐 Network</li>
        <li>⚙️ Settings</li>
        </ul>
        <footer><a href="https://github.com/Coll147/OpenFi">OpenFi project | FOOS | 2025</a></footer>
    </div>

    <div class="main fade">
        <!-- Aquí se cargará el contenido dinámicamente -->
    </div>

    <script>
        const main = document.querySelector('.main');
        const menuItems = document.querySelectorAll('.menu li');

        async function loadPage(page) {
        main.classList.add('fade-out');
        try {
            const response = await fetch(`pages/${page}.html`);
            const html = await response.text();

            setTimeout(() => {
            main.innerHTML = html;
            main.classList.remove('fade-out');
            main.classList.add('fade-in');
            setTimeout(() => main.classList.remove('fade-in'), 300);
            }, 300);
        } catch (err) {
            main.innerHTML = `<p>Error loading page: ${page}</p>`;
        }
        }

        menuItems.forEach(item => {
        item.addEventListener('click', () => {
            menuItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            loadPage(item.dataset.page);
        });
        });

        // Cargar "Devices" al inicio
        loadPage('devices');
    </script>
</body>
</html>
