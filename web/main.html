<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Network</title>
  <meta name="description" content="OpenFi Network">

  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  
  <link rel="stylesheet" type="text/css" href="./styles/main-default.css">
  <!-- <link rel="stylesheet" type="text/css" href="./styles/main-mobile.css"> -->
</head>

<body>
  <div class="layout">
    <nav class="sidebar">
      <img class="logo" src="./assets/logo.png" alt="OpenFi Logo" draggable="false">

      <ul class="menu">
        <li data-page="dashboard" class="active">📊 Dashboard</li>
        <li data-page="topology">🧭 Topology</li>
        <li data-page="devices">📶 Devices</li>
        <li data-page="logs">📜 Logs</li>
        <li data-page="wifi">📡 Wi-Fi</li>
        <li data-page="network">🌐 Network</li>
        <li data-page="settings">⚙️ Settings</li>
        <li data-page="information">📞 Information</li>
      </ul>


      <footer>
        <a href="https://github.com/Coll147/OpenFi">OpenFi project | FOOS | 2025</a>
      </footer>
    </nav>

    <main class="main">
      <iframe id="content-frame" src="no data"></iframe>
    </main>
  </div>

  <script>
    function updateiframe(page, element, push = true) {
      console.log("=== updateiframe Called")
      // Actualizar SRC del iframe
      document.getElementById('content-frame').src = "./dashboard/" + page + '.html';
      console.log("> updateiframe > src actualizado")

      // Actualizar URL si se ha navegado desde un click
      if (push) {
        history.pushState({page}, "", `?page=${page}`)
        document.title = page; // también el título :D
        console.log("> updateiframe > url pushed")
      }
      

      // Actualizar clases del nav
      document.querySelectorAll('.menu li').forEach(l => l.classList.remove('active'))
      console.log("> updateiframe > removed color menu")
          // if, en caso de que no se pase valor en element
      if (element) element.classList.add('active')
      console.log("> updateiframe > added color menu")
    }


    // Click en el menú
    document.querySelectorAll('.menu li').forEach(link => {
      link.addEventListener('click', function(e) { // listener en el click
        e.preventDefault()

        const page = this.dataset.page;

        updateiframe(page, this, true)
      });
    });


    // Cuando el usuario usa ATRÁS o ADELANTE
    window.addEventListener('popstate', (e) => {
      const page = e.state?.page || "dashboard"

      // Buscar el <li> correspondiente
      const li = document.querySelector(`.menu li[data-page="${page}"]`)

      updateiframe(page, li, false)
    });


    // Cargar página inicial si llega desde URL completa (con el ?)
    window.addEventListener("DOMContentLoaded", () => { // cuando cargue...
      
      // o pillo el enlace (desde los parámetros) o mando a dashboard
      const urlPage = new URLSearchParams(window.location.search).get("page") || "dashboard"
      
      // busco el li correspondiente
      const li = document.querySelector(`.menu li[data-page="${urlPage}"]`) 
      
      // actualizo la web
      updateiframe(urlPage, li, false)
    });
  </script>
</body>
</html>
