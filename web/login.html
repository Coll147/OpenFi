<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Login</title>
  <meta name="description" content="OpenFi Login Page">

  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">

  <link rel="stylesheet" href="./styles/main-default.css">
	<link rel="stylesheet" href="styles/pages/login.css">
</head>

<body>
<div class="layout">
	<nav class="nav">
    <img class="nav_logo" id="openfi-logo" src="./assets/dark-logo.png" alt="OpenFi Logo" draggable="false">

    <footer>
      <p> <!-- Good CSS tag :D -->
        <a href="https://jigsaw.w3.org/css-validator/check/referer">
          <img style="border:0;width:88px;height:31px" src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="Valid CSS!"/>
        </a>
      </p>

      <a href="https://github.com/Coll147/OpenFi"> OpenFi project | FOOS | &#169 2025 </a>
    </footer>
  </nav>

	<div class="main_content">
			<header class="main_header">
				<h1 id="title">YOUR local network <br> under YOUR control</h1>
			</header>

			<aside class="card hidden" id="alertBox" style="display: none;">
				<p class="text" id="cardText"></p>
			</aside>
		

			<main class="login-box">
						<div class="login_input_div">
						<form class="card">
							<h2>Local Network</h2>

							<div class="input-group">
								<span class="icon">👤</span>
								<input type="text" value="admin" readonly>
							</div>
							<div class="input-group">
								<span class="icon">🔒</span>
								<input type="password" id="password" placeholder="password">
							</div>
							<button onclick="login('password')" type="button" class="login-btn">
								Log in
							</button>
						</form>
						</div>
			</main>
	</div>
</div>
    

  <script src="./data/db.js"></script>
  <script src="./scripts/actions.js"></script>
  <script src="./scripts/pages/login.js"></script>
  <script>
		initdb()
		setBg()
	</script>
</body>
</html>
