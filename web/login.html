<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Login</title>
  <meta name="description" content="OpenFi Login Page">
  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
    <div class="container">
        <div class="sidebar">
        <h1><img class="logo" src="assets/logo.png" draggable="false"></h1>
        <footer><a href="https://github.com/Coll147/OpenFi">OpenFi project | FOOS | 2025</a></footer>
        </div>

        <div class="login-box">
        <h2>My Network</h2>
        <form>
            <div class="input-group">
            <span class="icon">👤</span>
            <input type="text" value="admin" readonly>
            </div>
            <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" placeholder="password">
            </div>
            <button onclick="window.location.href='main.html'" type="button" class="login-btn">Log in</button>    
        </form>
        </div>
    </div>
</body>
</html>
