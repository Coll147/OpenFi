<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi Login</title>
  <meta name="description" content="OpenFi Login Page">

  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">

  <link rel="stylesheet" href="styles/login.css">
</head>

<body>
    <div class="container">
        <div class="sidebar">
        <img class="logo" src="assets/logo.png" alt="OpenFi Logo" draggable="false">
        <footer><a href="https://github.com/Coll147/OpenFi">OpenFi project | FOOS | 2025</a></footer>
        </div>

        <div class="login-box">
            
            <div class="card hidden" id="alertBox" style="display: none;">
                <p class="text" id="cardText"></p>
            </div>

            <h2>My Network</h2>
            <form class="card">
                <div class="input-group">
                  <span class="icon">👤</span>
                  <input type="text" value="admin" readonly>
                </div>
                <div class="input-group">
                  <span class="icon">🔒</span>
                  <input type="password" id='password' placeholder="password">
                </div>
                <button onclick="login('password')" type="button" class="login-btn">Log in</button>
            </form>
        </div>
    </div>

    <script>
        function showText(text) {
            console.log("text function")
            const box = document.getElementById('alertBox')
            box.style.display = 'flex'

            const textCont = document.getElementById('cardText')
            textCont.textContent = text
            textCont.style.color = "#ff9898"
        }


        function login(id) {
            console.log("login function")
            const password = document.getElementById(id).value
            console.log(password)
            if (password == "coll147") {
                window.location.href='./main.html'
            }
            else {
                showText("Contraseña Incorrecta")
            }
        }
    </script>
</body>
</html>
