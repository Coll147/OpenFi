<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFi - Logs</title>
  <meta name="description" content="OpenFi Logs Page">
  <link rel="stylesheet" type="text/css" href="../styles/main-default.css">
  <link rel="stylesheet" type="text/css" href="../styles/pages/logs.css">
</head>

<body>
  <div class="main_layout">

      <header class="main_header">
        <h1 class="main-header__title">Logs</h1>

        <select id="riskFilter" class="btn main_btn" onchange="filterLogs()">
          <option value="All">All</option>
          <option value="Info">Info</option>
          <option value="Warn">Warning</option>
          <option value="High">High</option>
        </select>
      </header>

      <div class="main_wrapper">

        <main class="main_content">
          <table>
            <thead>
              <tr>
                <th>Event</th>
                <th>Device</th>
                <th id="time">Time <span class="sort_arrow" id="time_arrow">▲</span> </th>
                <th>Risk</th>
                <th>Information</th>
              </tr>
            </thead>
            <tbody id="devices-tbody">
              <!-- ./logs.js -->
            </tbody>
          </table>
        </main>

        <aside style="display: none;" id="context-menu" class="context-menu">
          <h2>Logs Information</h2>

          <table id="context-data">
            <!-- tbody from ./logs.js -->
          </table>
          <button class="btn restart" id="deleteBtn"> Delete Event </button>
        </aside>

      </div>
  </div>

<script src="../data/db.js"></script>
<script src="../scripts/actions.js"></script>
<script src="../scripts/pages/logs.js"></script>
<script>
  loadTable()
</script>

</body>
</html>
